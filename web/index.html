<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- Tablets: "Add to Home Screen" opens the game full screen in landscape. -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Redcat Kleuter 1">
  <meta name="theme-color" content="#000000">
  <title>Redcat Kleuter 1</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none;
      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: none; }
    #app { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    canvas.stage { display: block; image-rendering: auto; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #fff; font: 24px sans-serif; background: #000; cursor: pointer; user-select: none; touch-action: none; }
    #overlay[hidden] { display: none; }
    /* Asking for the game files (port/src/import/picker.ts). */
    #overlay.picker { cursor: default; font-size: 17px; padding: 16px; box-sizing: border-box; }
    #overlay.picker .panel { max-width: 560px; line-height: 1.45; }
    #overlay.picker h1 { font-size: 26px; margin: 0 0 12px; }
    #overlay.picker .buttons { display: flex; flex-wrap: wrap; gap: 12px; margin: 20px 0; }
    #overlay.picker button { font: inherit; padding: 12px 20px; border: 0; border-radius: 8px; background: #d8262e; color: #fff; cursor: pointer; }
    #overlay.picker button[hidden] { display: none; }
    #overlay.picker .hint { color: #bbb; font-size: 15px; }
    #overlay.picker .status { min-height: 1.45em; }
    #overlay.picker .status.error { color: #ff8a80; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="overlay"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
